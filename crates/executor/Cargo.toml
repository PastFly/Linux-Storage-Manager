[package]
name = "lsm-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
disposable-executor = []
disposable-loop-harness = ["disposable-executor", "dep:lsm-discovery"]
disposable-swap-migration-harness = ["disposable-executor", "dep:lsm-discovery"]
production-helper-protocol = ["dep:lsm-discovery"]
production-mutation-activation = []
production-create-activation = []
production-create-consent = ["production-create-activation"]
production-create-consent-lease = ["production-create-consent"]
production-create-execution-permit = ["production-create-consent-lease"]
production-create-runtime-preflight = ["production-create-execution-permit", "dep:lsm-discovery"]
production-create-tool-lease = ["production-create-runtime-preflight"]
production-create-runtime-launch = ["production-create-tool-lease"]
production-create-runtime-journal = ["production-create-runtime-launch"]
production-create-runtime-execution = ["production-create-runtime-journal"]
production-create-filesystem-execution = ["production-create-runtime-execution"]
production-create-mount-activation = ["production-create-filesystem-execution"]
production-create-mount-runtime-preflight = ["production-create-mount-activation", "dep:lsm-discovery"]\nproduction-create-mount-runtime-journal = ["production-create-mount-runtime-preflight"]\nproduction-create-mount-runtime-execution = ["production-create-mount-runtime-journal"]
production-swap-replacement-activation = []
production-swap-replacement-consent = ["production-swap-replacement-activation"]
production-swap-replacement-consent-lease = ["production-swap-replacement-consent"]
production-swap-replacement-execution-permit = ["production-swap-replacement-consent"]
production-swap-replacement-runtime-preflight = ["production-swap-replacement-consent-lease", "production-swap-replacement-execution-permit", "dep:lsm-discovery"]
production-swap-replacement-runtime-tool-lease = ["production-swap-replacement-runtime-preflight"]
production-swap-replacement-runtime-launch = ["production-swap-replacement-runtime-tool-lease"]
production-swap-replacement-runtime-journal = ["production-swap-replacement-runtime-launch"]
production-swap-replacement-runtime-execution = ["production-swap-replacement-runtime-journal"]
production-swap-replacement-persistent-config = ["production-swap-replacement-runtime-execution"]
production-swap-replacement-partition-removal-preflight = ["production-swap-replacement-persistent-config", "dep:lsm-discovery"]
production-swap-replacement-partition-removal-tool-lease = ["production-swap-replacement-partition-removal-preflight"]
production-swap-replacement-partition-removal-launch = ["production-swap-replacement-partition-removal-tool-lease"]
production-swap-replacement-partition-removal-execution = ["production-swap-replacement-partition-removal-launch", "dep:lsm-discovery"]
production-swap-loop-harness = ["production-swap-replacement-partition-removal-execution", "disposable-loop-harness", "dep:lsm-discovery"]
production-mutation-consent = ["production-mutation-activation"]
production-mutation-execution-permit = ["production-mutation-consent"]
production-chained-mutation-execution-permit = ["production-mutation-consent"]
production-chained-mutation-execution = ["production-chained-mutation-execution-permit"]
production-chained-verified-execution = ["production-chained-mutation-execution", "dep:lsm-discovery"]
production-mutation-execution = ["production-mutation-execution-permit", "dep:lsm-discovery"]
production-loop-harness = ["production-mutation-execution", "production-chained-verified-execution", "disposable-loop-harness"]

[[bin]]
name = "lsm-disposable-loop-harness"
path = "src/bin/disposable_loop_harness.rs"
required-features = ["disposable-loop-harness"]

[[bin]]
name = "lsm-disposable-swap-loop-harness"
path = "src/bin/disposable_swap_loop_harness.rs"
required-features = ["disposable-swap-migration-harness"]

[[bin]]
name = "lsm-privileged-helper-protocol"
path = "src/bin/privileged_helper_protocol.rs"
required-features = ["production-helper-protocol"]

[[bin]]
name = "lsm-production-loop-harness"
path = "src/bin/production_loop_harness.rs"
required-features = ["production-loop-harness"]

[[bin]]
name = "lsm-production-swap-loop-harness"
path = "src/bin/production_swap_loop_harness.rs"
required-features = ["production-swap-loop-harness"]

[dependencies]
libc = "0.2"
lsm-core = { path = "../core" }
lsm-discovery = { path = "../discovery", optional = true }
lsm-planner = { path = "../planner" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
