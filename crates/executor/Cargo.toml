[package]
name = "lsm-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
disposable-executor = []
disposable-loop-harness = ["disposable-executor", "dep:lsm-discovery"]
production-helper-protocol = ["dep:lsm-discovery"]
production-mutation-activation = []
production-mutation-consent = ["production-mutation-activation"]
production-mutation-execution-permit = ["production-mutation-consent"]
production-chained-mutation-execution-permit = ["production-mutation-consent"]
production-chained-mutation-execution = ["production-chained-mutation-execution-permit"]
production-mutation-execution = ["production-mutation-execution-permit", "dep:lsm-discovery"]
production-loop-harness = ["production-mutation-execution", "disposable-loop-harness"]

[[bin]]
name = "lsm-disposable-loop-harness"
path = "src/bin/disposable_loop_harness.rs"
required-features = ["disposable-loop-harness"]

[[bin]]
name = "lsm-privileged-helper-protocol"
path = "src/bin/privileged_helper_protocol.rs"
required-features = ["production-helper-protocol"]

[[bin]]
name = "lsm-production-loop-harness"
path = "src/bin/production_loop_harness.rs"
required-features = ["production-loop-harness"]

[dependencies]
libc = "0.2"
lsm-core = { path = "../core" }
lsm-discovery = { path = "../discovery", optional = true }
lsm-planner = { path = "../planner" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
