[package]
name = "lsm-executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
disposable-executor = []
disposable-loop-harness = ["disposable-executor", "dep:lsm-discovery"]

[[bin]]
name = "lsm-disposable-loop-harness"
path = "src/bin/disposable_loop_harness.rs"
required-features = ["disposable-loop-harness"]

[dependencies]
libc = "0.2"
lsm-core = { path = "../core" }
lsm-discovery = { path = "../discovery", optional = true }
lsm-planner = { path = "../planner" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
