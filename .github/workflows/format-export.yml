name: Export reviewed formatting

on:
  pull_request:
    paths: [".github/workflows/format-export.yml"]

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.repository == 'PastFly/Linux-Storage-Manager' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/m1a-read-only-planner'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Temporary object export only. No commits, refs, pushes, or default-branch writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8390a5ee0dbcb6d555e3e272bfee884c57586136
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - name: Reproduce reviewed generated bytes
        run: |
          test "$(git rev-parse HEAD)" = 8390a5ee0dbcb6d555e3e272bfee884c57586136
          cargo fmt --all
          cargo generate-lockfile
          git add -- crates Cargo.lock
          test "$(git write-tree)" = 60ac6554e529322959045c965f20e78d0205ee97
          cargo fmt --all -- --check
      - name: Export only verified Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          expected_tree = '60ac6554e529322959045c965f20e78d0205ee97'
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == expected_tree
          names = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          assert len(names) == 23 and 'Cargo.lock' in names
          assert all(n == 'Cargo.lock' or (n.startswith('crates/') and n.endswith('.rs')) for n in names)
          entries = []
          for name in names:
              raw = pathlib.Path(name).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              payload = json.dumps({'content': raw.decode('utf-8'), 'encoding': 'utf-8'}).encode()
              request = urllib.request.Request(
                  'https://api.github.com/repos/PastFly/Linux-Storage-Manager/git/blobs',
                  data=payload, method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
              assert result['sha'] == expected, name
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': expected})
              print(name, expected)
          manifest = {'source_commit': '8390a5ee0dbcb6d555e3e272bfee884c57586136',
                      'source_tree': '54ca412436f4c8e3e56495272fe19db5b7f949cf',
                      'formatted_tree': expected_tree, 'entries': entries}
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'reviewed-formatting.json'
          out.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-formatting-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-formatting.json
          retention-days: 1
          if-no-files-found: error
