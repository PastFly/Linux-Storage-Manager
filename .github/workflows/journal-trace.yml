name: Temporary journal descriptor trace

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install tracing tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends strace
      - name: Build tests
        run: cargo test --locked -p lsm-executor --lib --no-run
      - name: Probe anonymous staging inode close events
        run: python3 tools/journal_close_probe.py
      - name: Reproduce delayed close of the store's own writer
        run: cargo test --locked -p lsm-executor --lib delayed_close_of_own_staging_writer -- --nocapture
      - name: Check pinned inode across concurrent fork
        run: cargo test --locked -p lsm-executor --lib fork_before_writer_closes -- --nocapture
      - name: Compare sequential and parallel test processes
        run: |
          set +e
          evidence="${RUNNER_TEMP}/journal-trace"
          mkdir -p "$evidence"
          failed=0
          for mode in serial parallel-{1..3}; do
            threads=16
            if [ "$mode" = serial ]; then threads=1; fi
            strace -ff -ttt -yy -s 256 -o "$evidence/$mode.trace" \
              -e trace=openat,close,fsync,fdatasync,rename,renameat,renameat2,clone,clone3,fork,vfork,execve,execveat,inotify_init1,inotify_add_watch \
              cargo test --locked -p lsm-executor --lib -- \
              --test-threads="$threads" > "$evidence/$mode.log" 2>&1
            status=$?
            printf '%s exit=%s\n' "$mode" "$status"
            grep -E 'journal directory event:|test result:' "$evidence/$mode.log" | tail -20
            if [ "$status" -ne 0 ]; then failed=1; break; fi
          done
          exit "$failed"
      - name: Upload syscall and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-descriptor-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/journal-trace/
          retention-days: 7
          if-no-files-found: warn
