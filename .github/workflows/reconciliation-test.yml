name: Reconciliation development tests
on:
  push:
    branches: [feature/reconciliation-ci-test]
permissions:
  contents: read
jobs:
  reconciliation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked -p lsm-executor --lib reconciliation::tests -- --nocapture
      - run: cargo test --locked -p lsm-executor --lib reconciled_prewrite_plan_gets_a_new_attempt_without_overwriting_history -- --nocapture
      - run: cargo test --locked -p lsm-executor --lib missing_earlier_attempt_blocks_new_session -- --nocapture
      - run: cargo test --locked -p lsm-executor --lib backup_receipt_from_previous_session_cannot_authorize_a_new_attempt -- --nocapture
      - run: cargo test --locked -p linux-storage-manager-cli --bin storagemgr
      - run: cargo clippy --locked -p lsm-executor --lib -- -D warnings
