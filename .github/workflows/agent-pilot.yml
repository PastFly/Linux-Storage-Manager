name: Agent pilot

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-pilot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pilot:
    name: Isolated Rust pilot
    # Never route public PR code to the persistent VPS/Lab runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "1"
      RUST_TEST_THREADS: "2"
    steps:
      - name: Require disposable GitHub-hosted runner
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: test "$RUNNER_ENVIRONMENT" = github-hosted && test "$(id -u)" -ne 0
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record tested source
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf 'Tested PR head: %s\n' "$EXPECTED_HEAD" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD 'HEAD^{tree}'
      - name: Test harness without storage access
        run: bash tools/validate.sh --source-only
      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@360a4e93673de6630fac2478bc9e35244b01a759 # 1.88.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit and fixture tests
        run: cargo test --locked --workspace
