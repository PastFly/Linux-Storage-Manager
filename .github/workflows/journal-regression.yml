name: Journal regression

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  journal-concurrency:
    name: Journal concurrency tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Test sequential execution
        run: cargo test --locked -p lsm-executor --lib -- --test-threads=1
      - name: Test repeated parallel execution
        run: |
          for attempt in 1 2 3; do
            echo "Parallel attempt ${attempt}"
            cargo test --locked -p lsm-executor --lib -- --test-threads=16
          done

  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Exercise disposable Rust observer prototype
        run: |
          cargo build --locked --release --manifest-path .github/diagnostics/Cargo.toml --target-dir /tmp/lsm-observer-target
          sudo python3 -I .github/diagnostics/test-backup-observer.py /tmp/lsm-observer-target/release/lsm-observer /sys/fs/cgroup
      - name: Test gated child launch on disposable cgroups
        run: |
          sudo python3 -I .github/diagnostics/test-gated-launch.py /tmp/lsm-observer-target/release/lsm-gated-launch-proof /sys/fs/cgroup
      - name: Test gated worker module on disposable cgroups
        run: |
          sudo python3 -I .github/diagnostics/test-gated-worker-module.py /tmp/lsm-observer-target/release/lsm-gated-module-harness /sys/fs/cgroup
      - name: Test recovery evidence format
        run: cargo test --locked -p lsm-executor --lib backup_recovery_record::tests
      - name: Test journal recovery binding
        run: cargo test --locked -p lsm-executor --lib journal_store::tests::journal_v2
      - name: Test namespace watch discrimination
        run: cargo test --locked -p lsm-executor --lib journal_fd::namespace_watch_tests -- --test-threads=1 --nocapture
      - name: Test recovery evidence storage
        run: |
          cargo test --locked -p lsm-executor --lib backup_recovery_storage::tests -- --test-threads=1
          for attempt in 1 2 3; do
            cargo test --locked -p lsm-executor --lib backup_recovery_storage::tests -- --test-threads=16
          done
      - name: Test recovery copy collector
        run: |
          LSM_COLLECTOR_WATCH_DIAGNOSTICS=1 cargo test --locked -p lsm-executor --lib backup_recovery_collector::tests -- --test-threads=1 --nocapture
          for attempt in 1 2 3; do
            LSM_COLLECTOR_WATCH_DIAGNOSTICS=1 cargo test --locked -p lsm-executor --lib backup_recovery_collector::tests -- --test-threads=16 --nocapture
          done
      - name: Test v2 precondition attachment
        run: cargo test --locked -p lsm-executor --lib journal_store::tests::v2_
      - name: Test experimental journal binding model
        run: cargo test --locked -p lsm-executor --lib journal_store::tests::experimental_v2
      - name: Exercise observer in the actual CLI binary
        run: |
          cargo build --locked -p linux-storage-manager-cli --target-dir /tmp/lsm-cli-observer
          sudo env LSM_TEST_OBSERVER_CLI=1 python3 -I .github/diagnostics/test-backup-observer.py /tmp/lsm-cli-observer/debug/storagemgr /sys/fs/cgroup
      - name: Exercise disposable supervisor prototype
        run: |
          cargo test --locked -p lsm-executor --lib backup_supervisor::tests --no-run
          sudo mkdir /sys/fs/cgroup/lsm-disposable-supervisor-test
          trap 'sudo rmdir /sys/fs/cgroup/lsm-disposable-supervisor-test/* /sys/fs/cgroup/lsm-disposable-supervisor-test || true' EXIT
          sudo env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" LSM_TEST_DISPOSABLE_CGROUP=/sys/fs/cgroup/lsm-disposable-supervisor-test LSM_TEST_OBSERVER_EXE=/tmp/lsm-cli-observer/debug/storagemgr cargo test --locked -p lsm-executor --lib backup_supervisor::tests -- --include-ignored --test-threads=1
      - name: Check disposable runner cgroup and pidfd primitives
        run: |
          sudo python3 - <<'PY'
          import os
          import signal
          import subprocess
          import time
          from pathlib import Path
          root = Path('/sys/fs/cgroup')
          print('kernel', os.uname().release, flush=True)
          print('cgroup_v2', (root / 'cgroup.controllers').exists(), 'writable', os.access(root, os.W_OK), flush=True)
          print('pidfd_open', hasattr(os, 'pidfd_open'), flush=True)
          group = root / ('lsm-probe-' + str(os.getpid()))
          try:
              group.mkdir()
          except OSError as error:
              print('CGROUP_CREATE_FAILED', repr(error), flush=True)
              raise
          process = None
          try:
              print('cgroup.kill', (group / 'cgroup.kill').exists(), flush=True)
              import ctypes
              class CloneArgs(ctypes.Structure):
                  _fields_ = [(name, ctypes.c_uint64) for name in (
                      'flags', 'pidfd', 'child_tid', 'parent_tid', 'exit_signal',
                      'stack', 'stack_size', 'tls', 'set_tid', 'set_tid_size', 'cgroup')]
              group_fd = os.open(group, os.O_PATH | os.O_CLOEXEC)
              child_pidfd = ctypes.c_int(-1)
              args = CloneArgs()
              args.flags = 0x200000000 | 0x1000
              args.pidfd = ctypes.addressof(child_pidfd)
              args.exit_signal = signal.SIGCHLD
              args.cgroup = group_fd
              libc = ctypes.CDLL(None, use_errno=True)
              result = libc.syscall(435, ctypes.byref(args), ctypes.sizeof(args))
              if result == 0:
                  os._exit(0)
              if result < 0:
                  err = ctypes.get_errno()
                  raise OSError(err, os.strerror(err))
              os.waitpid(result, 0)
              os.close(child_pidfd.value)
              os.close(group_fd)
              print('CLONE_INTO_CGROUP_OK', flush=True)
              process = subprocess.Popen(['/bin/sleep', '30'])
              (group / 'cgroup.procs').write_text(str(process.pid))
              (group / 'cgroup.kill').write_text('1')
              result = process.wait(timeout=10)
              print('CGROUP_KILL_EXIT', result, flush=True)
              if result != -signal.SIGKILL:
                  raise RuntimeError('cgroup.kill did not kill the disposable process')
          finally:
              if process is not None and process.poll() is None:
                  process.kill()
                  process.wait()
              for _ in range(100):
                  try:
                      group.rmdir()
                      break
                  except OSError:
                      time.sleep(.05)
              else:
                  raise RuntimeError('disposable cgroup did not become empty')
          PY
