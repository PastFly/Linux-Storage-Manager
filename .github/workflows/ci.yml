name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test harness without root or storage tools
        run: bash tools/validate.sh --source-only

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    needs: harness
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        id: toolchain
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Fetch pinned dependencies
        id: resolve
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fetch --locked
      - name: Clippy
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked --workspace
      - name: Check non-executing GPT-tail Create intent
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-planner gpt_tail_intent
      - name: Check non-executing GPT-tail production activation
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-gpt-tail-activation --lib
      - name: Check root-owned GPT-tail production consent
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-gpt-tail-consent --lib
      - name: Check pinned GPT-tail production consent lease
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-gpt-tail-consent-lease --lib
      - name: Check non-spawning GPT-tail execution permit
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-gpt-tail-execution-permit --lib
      - name: Test disposable executor feature boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features disposable-executor --lib
      - name: Check isolated loop harness feature
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo clippy --locked -p lsm-executor --features disposable-loop-harness --bin lsm-disposable-loop-harness -- -D warnings
      - name: Check isolated swap replacement harness feature
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo clippy --locked -p lsm-executor --features disposable-swap-migration-harness --bin lsm-disposable-swap-loop-harness -- -D warnings
      - name: Check non-mutating privileged-helper protocol boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo clippy --locked -p lsm-executor --features production-helper-protocol --bin lsm-privileged-helper-protocol -- -D warnings
      - name: Check non-executing create production activation boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-activation --lib
      - name: Check root-owned create production consent boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-consent --lib
      - name: Check pinned create production consent lease
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-consent-lease --lib
      - name: Check non-spawning create production execution permit
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-execution-permit --lib
      - name: Check fresh create production runtime preflight
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-runtime-preflight --lib
      - name: Check pinned create runtime tool lease
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-tool-lease --lib
      - name: Check frozen create runtime launch contract
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-runtime-launch --lib
      - name: Check durable create runtime journal boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-runtime-journal --lib
      - name: Check gated create partition-table crossing
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-runtime-execution --lib
      - name: Check gated create filesystem-format crossing
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-filesystem-execution --lib
      - name: Check non-executing create mount activation boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-mount-activation --lib
      - name: Check fresh pinned create mount runtime contract
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-mount-runtime-preflight --lib
      - name: Check durable create mount runtime journal
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-mount-runtime-journal --lib
      - name: Check gated create mount runtime crossing
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-mount-runtime-execution --lib
      - name: Check durable create persistent-config journal
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-persistent-config-journal --lib
      - name: Check atomic create persistent-config update
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-create-persistent-config --lib
      - name: Check full production create loop harness feature
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo clippy --locked -p lsm-executor --features production-create-loop-harness --bin lsm-production-create-loop-harness -- -D warnings
      - name: Check non-executing swap production activation boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-activation --lib
      - name: Check root-owned swap production consent boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-consent --lib
      - name: Check pinned swap production consent lease
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-consent-lease --lib
      - name: Check fresh swap runtime preflight boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-runtime-preflight --lib
      - name: Check pinned swap runtime executable lease
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-runtime-tool-lease --lib
      - name: Check frozen swap runtime descriptor launch contract
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-runtime-launch --lib
      - name: Check durable swap runtime journal boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-runtime-journal --lib
      - name: Check gated production swap runtime crossing
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-runtime-execution --lib
      - name: Check atomic production swap persistent-config update
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-persistent-config --lib
      - name: Check swap partition-removal preflight boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-partition-removal-preflight --lib
      - name: Check pinned partition-removal tool lease
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-partition-removal-tool-lease --lib
      - name: Check exact partition-removal launch contract
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-partition-removal-launch --lib
      - name: Check gated final partition-removal execution
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-partition-removal-execution --lib
      - name: Check full production swap loop harness feature
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo clippy --locked -p lsm-executor --features production-swap-loop-harness --bin lsm-production-swap-loop-harness -- -D warnings
      - name: Check non-spawning swap production execution permit
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-swap-replacement-execution-permit --lib
      - name: Check gated production descriptor execution boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-mutation-execution --lib
      - name: Check non-spawning chained production execution permit
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-chained-mutation-execution-permit --lib
      - name: Check gated chained production descriptor execution boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-chained-mutation-execution --lib
      - name: Check chained production verified execution boundary
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo test --locked -p lsm-executor --features production-chained-verified-execution --lib
      - name: Check isolated production loop harness feature
        if: ${{ !cancelled() && steps.resolve.outcome == 'success' }}
        run: cargo clippy --locked -p lsm-executor --features production-loop-harness --bin lsm-production-loop-harness -- -D warnings
      # Preserve generated formatting and dependency evidence for review.
      # This runs AFTER checks and cannot turn failed checks into success.
      - name: Collect source and formatting diagnostics
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          mkdir -p "${RUNNER_TEMP}/ci-diagnostics"
          git rev-parse HEAD > "${RUNNER_TEMP}/ci-diagnostics/checkout-sha.txt"
          git rev-parse HEAD^{tree} > "${RUNNER_TEMP}/ci-diagnostics/checkout-tree.txt"
          git archive --format=tar HEAD > "${RUNNER_TEMP}/ci-diagnostics/source.tar"
          cargo fmt --all
          git diff --binary -- crates > "${RUNNER_TEMP}/ci-diagnostics/rustfmt.patch"
          if test -f Cargo.lock; then
            cp Cargo.lock "${RUNNER_TEMP}/ci-diagnostics/Cargo.lock"
          fi
      - name: Upload build diagnostics
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-diagnostics/
          retention-days: 1
          if-no-files-found: error

  loop-integration:
    name: Loop integration
    runs-on: ubuntu-24.04
    needs: rust
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Install storage test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lvm2 e2fsprogs xfsprogs util-linux fdisk
      - name: Verify trusted production-helper tool provenance
        run: |
          cargo test --locked -p lsm-executor --features production-helper-protocol \
            privileged_tools::tests::resolves_installed_storage_tools_with_root_owned_provenance \
            -- --ignored --exact --nocapture
      - name: Build storagemgr and isolated executor harnesses
        run: |
          cargo build --locked --release --workspace
          cargo build --locked --release -p lsm-executor --features disposable-loop-harness --bin lsm-disposable-loop-harness
          cargo build --locked --release -p lsm-executor --features disposable-swap-migration-harness --bin lsm-disposable-swap-loop-harness
          cargo build --locked --release -p lsm-executor --features production-loop-harness --bin lsm-production-loop-harness
          cargo build --locked --release -p lsm-executor --features production-swap-loop-harness --bin lsm-production-swap-loop-harness
          cargo build --locked --release -p lsm-executor --features production-create-loop-harness --bin lsm-production-create-loop-harness
      - name: Test planning and partition/LVM recovery on disposable fixtures
        run: |
          for attempt in 1 2 3; do
            echo "Integration repetition ${attempt}/3"
            sudo python3 -I tests/integration/loop_matrix.py \
              --allow-disposable-loop-tests \
              "${GITHUB_WORKSPACE}/target/release/storagemgr" \
              "${GITHUB_WORKSPACE}/target/release/lsm-disposable-loop-harness" \
              --swap-executor-binary "${GITHUB_WORKSPACE}/target/release/lsm-disposable-swap-loop-harness" \
              --production-executor-binary "${GITHUB_WORKSPACE}/target/release/lsm-production-loop-harness" \
              --production-swap-executor-binary "${GITHUB_WORKSPACE}/target/release/lsm-production-swap-loop-harness" \
              --production-create-executor-binary "${GITHUB_WORKSPACE}/target/release/lsm-production-create-loop-harness"
          done

      - name: Package tested read-only prototype
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          OUT="${RUNNER_TEMP}/storagemgr-linux-x86_64"
          mkdir -p "${OUT}"
          cp target/release/storagemgr "${OUT}/storagemgr"
          printf 'Source head: %s\nTested checkout: %s\nPlatform: Linux x86_64, Ubuntu 24.04 runner\nMode: read-only M0/M1A prototype; no apply/executor\n' \
            "${SOURCE_HEAD}" "$(git rev-parse HEAD)" > "${OUT}/BUILD_INFO.txt"
          cp README.md "${OUT}/README.md"
          (cd "${OUT}" && sha256sum storagemgr > SHA256SUMS)
          tar -C "${OUT}" -czf "${RUNNER_TEMP}/storagemgr-linux-x86_64.tar.gz" storagemgr BUILD_INFO.txt README.md SHA256SUMS
      - name: Upload tested prototype
        uses: actions/upload-artifact@v4
        with:
          name: storagemgr-linux-x86_64-${{ github.run_id }}
          path: ${{ runner.temp }}/storagemgr-linux-x86_64.tar.gz
          retention-days: 7
          if-no-files-found: error
