name: CI

on:
  push:
    branches: ["master", "bootstrap/**", "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  loop-integration:
    name: Loop integration
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install storage test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lvm2 e2fsprogs jq util-linux

      - name: Build storagemgr
        run: cargo build --workspace

      - name: Run disposable loop-device matrix
        run: sudo bash tests/integration/loop-matrix.sh "${GITHUB_WORKSPACE}/target/debug/storagemgr"
