name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Feature commits are validated through their PR, not twice via push + PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test harness without root or storage tools
        run: bash tools/validate.sh --source-only

  rust:
    name: Rust checks
    runs-on: ubuntu-24.04
    needs: harness
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  loop-integration:
    name: Loop integration
    runs-on: ubuntu-24.04
    needs: rust
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Install storage test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lvm2 e2fsprogs xfsprogs util-linux fdisk
      - name: Build storagemgr
        run: cargo build --workspace
      - name: Test planning on disposable ext4 and XFS fixtures
        run: >-
          sudo python3 -I tests/integration/loop_matrix.py
          --allow-disposable-loop-tests
          "${GITHUB_WORKSPACE}/target/debug/storagemgr"
