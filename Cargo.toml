[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/discovery",
    "crates/tui",
    "crates/cli",
    "crates/planner",
    "crates/executor",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
version = "0.1.0-dev"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
